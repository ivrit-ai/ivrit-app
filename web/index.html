<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F3" />
    <script src="/theme.js"></script>
    <meta name="description" content="ivrit.ai: transcribe Hebrew recordings with speakers, search everything you transcribed, on every device." />
    <title>ivrit.ai</title>
    <link rel="icon" href="/icons/mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/ibm-plex-sans-hebrew-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/transcription/transcription.css" />
    <!-- Every module the page imports at start, fetched together rather than one
         import level at a time (the browser test checks this list is complete). -->
    <link rel="modulepreload" href="/app.js" />
    <link rel="modulepreload" href="/i18n.js" />
    <link rel="modulepreload" href="/client/communicator.js" />
    <link rel="modulepreload" href="/transcription/api.js" />
    <link rel="modulepreload" href="/transcription/strings.js" />
    <link rel="modulepreload" href="/transcription/transcript.js" />
    <link rel="modulepreload" href="/transcription/reader.js" />
    <link rel="modulepreload" href="/transcription/recorder.js" />
    <link rel="modulepreload" href="/transcription/view.js" />
    <link rel="modulepreload" href="/transcription/settings.js" />
    <link rel="modulepreload" href="/transcription/watches.js" />
    <link rel="modulepreload" href="/transcription/local/local.js" />
    <link rel="modulepreload" href="/transcription/local/live.js" />
    <link rel="modulepreload" href="/transcription/live-view.js" />
    <link rel="modulepreload" href="/search/normalize.js" />
    <link rel="modulepreload" href="/search/engine.js" />
    <link rel="modulepreload" href="/search/library.js" />
    <link rel="modulepreload" href="/search/view.js" />
    <script src="/config.js"></script>
    <script src="/client/store.js"></script>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3.5 13.5h4.2l1.6 2.5h5.4l1.6-2.5h4.2" /><path d="M5.6 5.5h12.8l2.1 8v4a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-4z" /></symbol>
        <symbol id="i-sources" viewBox="0 0 24 24"><path d="M9.5 14.5l5-5" /><path d="M11 6.5l1.8-1.8a4 4 0 0 1 5.6 5.6L16.6 12" /><path d="M13 17.5l-1.8 1.8a4 4 0 0 1-5.6-5.6L7.4 12" /></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></symbol>
        <symbol id="i-admin" viewBox="0 0 24 24"><path d="M12 3.5l7 2.8v5.2c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6.3z" /><path d="M9 12l2 2 4-4" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="M15.5 15.5L20 20" /></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5" /><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" /></symbol>
        <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 7.5L12 3.8l4 3.7" /><path d="M7 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V5h4v2M6.5 7l.8 11.2a2 2 0 0 0 2 1.8h5.4a2 2 0 0 0 2-1.8L17.5 7" /></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M13.5 4.5h6v6M19.5 4.5l-8 8" /><path d="M17.5 14v3.5a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2H10" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 1.5H5z" /><path d="M10 20.5h4" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></symbol>
        <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.7" /><path d="M12 16.9v.1" /></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" /></symbol>
        <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" /><path d="M12 10.5v6M9 13.5h6" /></symbol>
        <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 6.5v11M12 4v16M16 7.5v9M20 10.5v3" /></symbol>
        <symbol id="i-device" viewBox="0 0 24 24"><rect x="7" y="3.5" width="10" height="17" rx="2.5" /><path d="M11 17.5h2" /></symbol>
        <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4M4.5 19.5l1-4.5L15.8 4.7a1.4 1.4 0 0 1 2 0l1.5 1.5a1.4 1.4 0 0 1 0 2L9 18.5z" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11L12 15.5 16.5 11" /><path d="M5 19.5h14" /></symbol>
        <symbol id="i-display" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13" /></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4.5 19.5h15" /><path d="M7.5 16v-5M12 16V6M16.5 16v-8" /></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19.5s-7-4.3-7-9.4A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.1c0 5.1-7 9.4-7 9.4z" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6.5v11M15 6.5v11" /></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" /></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M9.5 6.5L15 12l-5.5 5.5" /></symbol>
        <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="11.5" rx="2" /><path d="M9 19.5h6" /></symbol>
      </defs>
    </svg>

    <header class="bar">
      <a class="brand" href="/" aria-label="ivrit.ai">
        <img src="/icons/mark.svg" alt="" width="30" height="30" />
        <span class="wordmark" dir="ltr">ivrit.ai</span>
      </a>
      <div class="bar-end">
        <a class="support" href="mailto:info@ivrit.ai" data-i18n-label="support">
          <svg class="i"><use href="#i-help" /></svg><span data-i18n="support">Support</span>
        </a>
        <div class="seg" id="lang-switch" role="group" aria-label="Language">
          <button type="button" data-locale="en">EN</button>
          <button type="button" data-locale="he">עב</button>
          <button type="button" data-locale="yi" lang="yi">ייִ</button>
        </div>
        <nav id="tabs" class="tabs" hidden>
          <button type="button" data-view="transcribe"><svg class="i"><use href="#i-wave" /></svg><span data-i18n="tabTranscribe">Transcribe</span></button>
          <button type="button" data-view="live" id="tab-live"><svg class="i"><use href="#i-mic" /></svg><span data-i18n="tabLive">Live</span><b id="live-dot" class="live-dot" hidden></b></button>
          <button type="button" data-view="inbox"><svg class="i"><use href="#i-inbox" /></svg><span data-i18n="tabInbox">Messages</span><b id="unread-badge" class="count" hidden></b></button>
          <button type="button" data-view="settings"><svg class="i"><use href="#i-settings" /></svg><span data-i18n="tabSettings">Settings</span></button>
        </nav>
      </div>
    </header>

    <main id="main">
      <!-- Signing in: what ivrit.ai is, the one way in, and what it agrees to. -->
      <section id="landing" class="landing" hidden>
        <img class="landing-mark" src="/icons/mark.svg" alt="" width="56" height="56" />
        <h1 data-i18n="landingTitle"></h1>
        <p class="lede" data-i18n="landingLede"></p>
        <a id="signin" class="btn signin" href="#">
          <svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span data-i18n="continueGoogle"></span>
        </a>
        <!-- Live transcription runs on the device: no account needed. -->
        <button id="landing-live" class="btn landing-live" type="button"><svg class="i"><use href="#i-mic" /></svg><span data-i18n="liveNoSignIn"></span></button>
        <p class="fine" data-i18n="driveNote"></p>
        <p class="fine">
          <span data-i18n="consentBefore"></span><a href="https://www.ivrit.ai/en/privacy/" target="_blank" rel="noopener" data-i18n="consentLink"></a><span data-i18n="consentAfter"></span>
        </p>
        <p class="fine landing-links"><a href="https://www.ivrit.ai/" target="_blank" rel="noopener" data-i18n="aboutLink"></a></p>
      </section>

      <section id="view-inbox" class="view" hidden>
        <div class="toolbar">
          <label class="search">
            <svg class="i"><use href="#i-search" /></svg>
            <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search" />
          </label>
          <button id="mark-all" class="btn quiet small" type="button" data-i18n="markAllRead"></button>
          <!-- Linking services (Eliezer…) is for messages, so it lives here, not in the tabs. -->
          <button id="open-sources" class="btn quiet small" type="button"><svg class="i"><use href="#i-sources" /></svg><span data-i18n="sourcesButton"></span></button>
        </div>
        <div id="chips" class="chips" role="tablist"></div>
        <div id="feed" class="feed" aria-live="polite"></div>
      </section>

      <section id="view-search" class="view wide search-view" hidden></section>

      <!-- Live transcription (web/transcription/live-view.js), signed in or not. -->
      <section id="view-live" class="view" hidden>
        <div id="live-mount"></div>
      </section>

      <section id="view-transcribe" class="view wide" hidden>
        <button id="transcribe-back" class="btn quiet small" type="button" hidden data-i18n="back"></button>
        <!-- Transcribing keeps files in the user's Google Drive: this browser has to
             be signed in at the server with Drive (web/app.js, connectDrive). -->
        <div id="transcribe-connect" class="panel" hidden>
          <h3 data-i18n="connectDriveTitle"></h3>
          <p class="muted" data-i18n="connectDriveBody"></p>
          <div class="row"><button id="connect-drive" class="btn primary" type="button" data-i18n="connectDrive"></button></div>
        </div>
        <!-- Transcribing (web/transcription/view.js). -->
        <div id="transcribe-mount"></div>
      </section>

      <section id="view-sources" class="view" hidden>
        <button id="sources-back" class="btn quiet small" type="button" data-i18n="back"></button>
        <h2 class="title" data-i18n="sourcesTitle"></h2>
        <p class="lede" data-i18n="sourcesLede"></p>
        <div id="sources" class="stack"></div>

      </section>

      <!-- Signed out, only what needs no account shows here (body.signed-out). -->
      <section id="view-settings" class="view" hidden>
        <div id="account" class="panel account-only"></div>

        <div class="panel">
          <h3 data-i18n="languageTitle"></h3>
          <div class="seg wide" id="lang-setting" role="group">
            <button type="button" data-locale="en">English</button>
            <button type="button" data-locale="he">עברית</button>
            <button type="button" data-locale="yi" lang="yi">ייִדיש</button>
          </div>
        </div>

        <div class="panel">
          <h3 data-i18n="themeTitle"></h3>
          <div class="seg wide" id="theme-setting" role="group">
            <button type="button" data-theme-choice="system" data-i18n="themeSystem"></button>
            <button type="button" data-theme-choice="light" data-i18n="themeLight"></button>
            <button type="button" data-theme-choice="dark" data-i18n="themeDark"></button>
          </div>
        </div>

        <div class="panel account-only">
          <h3 data-i18n="notificationsTitle"></h3>
          <p id="permission" class="muted"></p>
          <div id="permission-help"></div>
          <div class="row">
            <button id="enable" class="btn primary" type="button" hidden data-i18n="enable"></button>
            <button id="test" class="btn" type="button" hidden data-i18n="sendTest"></button>
          </div>
          <div id="popup-test" class="popup-test" hidden></div>
        </div>

        <div class="panel account-only">
          <h3 data-i18n="devicesTitle"></h3>
          <div id="devices" class="list"></div>
        </div>

        <div class="panel account-only">
          <h3 data-i18n="transcribeSettingsTitle"></h3>
          <div id="transcribe-settings-box"></div>
        </div>
        <div id="watch-panel" class="panel account-only" hidden>
          <h3 data-i18n="watchTitle"></h3>
          <div id="watch-settings-box"></div>
        </div>
        <div class="panel account-only">
          <h3 data-i18n="clipsTitle"></h3>
          <p class="muted" data-i18n="clipsBody"></p>
          <label class="row"><input id="clips-drive" type="checkbox" /> <span data-i18n="clipsToggle"></span></label>
        </div>
        <div class="panel account-only">
          <h3 data-i18n="storageTitle"></h3>
          <p id="storage" class="muted"></p>
          <div class="row"><button id="clear-history" class="btn" type="button" data-i18n="clearHistory"></button></div>
        </div>

        <div class="panel">
          <h3 data-i18n="aboutTitle"></h3>
          <p class="muted" data-i18n="aboutBody"></p>
          <p id="version" class="fine" dir="ltr"></p>
          <div class="row">
            <a class="btn" href="https://www.patreon.com/ivrit_ai/membership" target="_blank" rel="noopener" data-i18n="supportUs"></a>
            <a class="btn quiet" href="https://www.ivrit.ai/en/privacy/" target="_blank" rel="noopener" data-i18n="terms"></a>
          </div>
        </div>

        <details class="panel diag account-only">
          <summary data-i18n="diagnostics"></summary>
          <dl id="diagnostics"></dl>
          <p><a href="/lab/" data-i18n="labLink"></a></p>
        </details>

        <div class="row end account-only">
          <button id="signout" class="btn" type="button" data-i18n="signOut"></button>
          <button id="delete-account" class="btn danger" type="button" data-i18n="deleteAccount"></button>
        </div>
      </section>

      <p class="footer-links"><a href="/privacy" data-i18n="privacy"></a></p>
    </main>

    <dialog id="confirm" class="dialog">
      <p id="confirm-text"></p>
      <form method="dialog" class="row end">
        <button value="no" class="btn quiet" data-i18n="cancel"></button>
        <button value="yes" id="confirm-ok" class="btn primary"></button>
      </form>
    </dialog>

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <div id="sheet-avatar"></div>
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" type="button" data-i18n-label="cancel">
          <svg class="i"><use href="#i-close" /></svg>
        </button>
      </header>
      <div id="sheet-body"></div>
    </dialog>

    <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" type="button" hidden></button></div>
    <!-- If the app fails to start (a script error, a call that never returns),
         say so and offer a retry, rather than leave an empty page. -->
    <script>
      (function () {
        var errors = [];
        addEventListener("error", function (e) { errors.push(e.message + (e.filename ? " @ " + e.filename + ":" + e.lineno : "")); });
        addEventListener("unhandledrejection", function (e) { errors.push("rejected: " + (e.reason && e.reason.message || e.reason)); });
        setTimeout(function () {
          if (document.body.dataset.started) return;
          var he = document.documentElement.lang === "he" || /^(he|iw)/i.test(navigator.language);
          var box = document.createElement("div");
          box.className = "startup-failed";
          box.innerHTML = "<h2></h2><p></p><button class='btn primary' type='button'></button><pre></pre>";
          box.querySelector("h2").textContent = he ? "האפליקציה לא נטענה" : "The app didn't load";
          box.querySelector("p").textContent = he ? "בדקו את החיבור ונסו שוב. אם זה חוזר, שלחו לנו צילום מסך של המסך הזה: info@ivrit.ai" : "Check the connection and try again. If it keeps happening, send a screenshot of this screen to info@ivrit.ai";
          box.querySelector("button").textContent = he ? "ניסיון נוסף" : "Try again";
          box.querySelector("button").onclick = function () { location.reload(); };
          box.querySelector("pre").textContent = [
            "shell: " + (window.Capacitor ? "native" : "web"),
            "ua: " + navigator.userAgent,
          ].concat(errors).join("\n");
          document.getElementById("main").prepend(box);
        }, 10000);
      })();
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
