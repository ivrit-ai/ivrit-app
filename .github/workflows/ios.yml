# The iPhone app (shell/ios), built on a Mac. Every change to the shells is
# compiled for the simulator, unsigned; run by hand with "testflight" to sign it
# and upload it to App Store Connect (scripts/build-ios.sh).
name: iPhone app

on:
  push:
    branches: [master]
    paths:
      - "shell/**"
      - "scripts/build-ios.sh"
      - "scripts/check-native-api.mjs"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Both shells and the web app agree (shell/native-api.json)
        run: node scripts/check-native-api.mjs
      - name: Build for the simulator
        if: ${{ !inputs.testflight }}
        run: scripts/build-ios.sh simulator
      - name: Sign and upload to TestFlight
        if: ${{ inputs.testflight }}
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IVRIT_TEAM_ID: ${{ secrets.IVRIT_TEAM_ID }}
        run: |
          # Under Apple's own name for it, which Xcode looks for.
          export ASC_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$ASC_KEY" > "$ASC_KEY_PATH"
          # The key as stored signs in to App Store Connect (else the archive fails vaguely).
          node -e '
            const crypto = require("crypto"), fs = require("fs");
            const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const head = b64({ alg: "ES256", kid: process.env.ASC_KEY_ID, typ: "JWT" });
            const body = b64({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
            const sig = crypto.sign("sha256", Buffer.from(head + "." + body), { key: fs.readFileSync(process.env.ASC_KEY_PATH), dsaEncoding: "ieee-p1363" }).toString("base64url");
            fetch("https://api.appstoreconnect.apple.com/v1/apps?limit=1", { headers: { authorization: "Bearer " + head + "." + body + "." + sig } })
              .then((r) => { console.log("App Store Connect API:", r.status); if (!r.ok) process.exit(1); });
          '
          scripts/build-ios.sh testflight
