# The iPhone app's Xcode project, generated from this file by XcodeGen
# (`xcodegen` here; scripts/build-ios.sh and CI run it), so App.xcodeproj is
# not kept in git. Capacitor manages CapApp-SPM (its plugins) and App/public
# (the fallback page); `npx cap sync ios` in shell/ refreshes both.
name: App
options:
  bundleIdPrefix: ai.ivrit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Debug:
      CAPACITOR_DEBUG: "true"
    Release:
      CAPACITOR_DEBUG: "false"
packages:
  CapApp-SPM:
    path: CapApp-SPM
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - public
          - Info.plist
          - App.entitlements
          - capacitor.config.json
          - config.xml
      # Written by `npx cap sync ios`, which needs the project first: optional,
      # so the project can be generated before them.
      - path: App/public
        type: folder
        buildPhase: resources
        optional: true
      - path: App/capacitor.config.json
        buildPhase: resources
        optional: true
      - path: App/config.xml
        buildPhase: resources
        optional: true
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ivrit.app
        PRODUCT_NAME: App
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: CapApp-SPM
        product: CapApp-SPM
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: NotificationService
      - target: ShareExtension
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - Info.plist
          - NotificationService.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ivrit.app.NotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - ShareExtension.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ivrit.app.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  App:
    build:
      targets:
        App: all
    archive:
      config: Release
