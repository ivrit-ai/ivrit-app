<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ivrit.ai</title>
    <!-- Shown by the shell when app.ivrit.ai cannot be reached: the app itself
         is the website, so without a connection on first open there is nothing
         else to show. -->
    <style>
      :root { color-scheme: light dark; --ink: #111110; --paper: #f7f6f3; }
      @media (prefers-color-scheme: dark) { :root { --ink: #f2f1ed; --paper: #111110; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
             font: 17px/1.5 system-ui, sans-serif; background: var(--paper); color: var(--ink); }
      button { margin-top: 18px; font: inherit; padding: 12px 24px; border-radius: 999px; border: 0;
               background: var(--ink); color: var(--paper); }
      .en { opacity: 0.7; }
    </style>
  </head>
  <body>
    <div>
      <p>אין חיבור לאינטרנט.<br /><span class="en" lang="en" dir="ltr">No internet connection.</span></p>
      <button type="button" onclick="location.replace('https://app.ivrit.ai/')">ניסיון נוסף · Try again</button>
    </div>
  </body>
</html>
